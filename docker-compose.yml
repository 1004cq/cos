version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cos
      POSTGRES_PASSWORD: cos_password_change_me
      POSTGRES_DB: cos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # 应用服务（生产时可取消注释并构建）
